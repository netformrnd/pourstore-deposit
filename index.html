<!DOCTYPE html>
<html lang="ko" data-nf-gate="check">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매출관리 시스템</title>
    <!-- 넷폼 라운지 로그인(2026-11-09): 공용 비밀번호 대신 라운지 권한으로 입장 -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>
    <script src="https://netformrnd.github.io/nf_lounge/nf-config.js"></script>
    <script src="lounge-gate.js?v=20261109"></script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Pretendard Variable', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
        }
        .login-container {
            display: flex;
            gap: 1px;
            background: #e0e0e0;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0,0,0,0.08);
        }
        .card {
            width: 260px;
            padding: 56px 40px;
            background: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            position: relative;
        }
        .card:hover { background: #fafafa; }
        .card:active { background: #f5f5f5; }
        .card-name {
            font-size: 20px;
            font-weight: 700;
            color: #111;
            letter-spacing: -0.3px;
        }
        .card-pour:hover .card-name { color: #1B2A4A; }
        .card-gro:hover .card-name { color: #111; }

    </style>
</head>
<body>
    <div class="login-container">
        <div class="card card-pour" onclick="location.href='pourstore-deposit/index.html'">
            <div class="card-name">포어스토어</div>
        </div>
        <div class="card card-gro" onclick="location.href='grohome-deposit/index.html'">
            <div class="card-name">그로홈</div>
        </div>
    </div>

</body>
</html>
